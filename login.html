<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

  
<body>
    <div class="wrapper">
    <div class="left-side">
     <img src="new era.png" alt="pic 1">
    </div>
    <div class="right-side">
        <h1>ERASync</h1>
        <p>"Tracked in Real Time. Ready for you"</p>
       
        <div class ="form-card">
            <form id="login-form" >
          <div class="toggle">
            <button type= "button" id="user-btn" class="active-user">User</button>
            <button type= "button" id="admin-btn">Admin</button>
        </div>
            <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
           <div class = "remember-row">
            <div class="remember-left">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
           
            </div>
             <button>Login</button>
         </div>

           <div class ="divider">Or</div>
           <button type="button" id="google-btn" class="google-btn"> 
            
           <img src="google-icon.jpg" alt=""> Continue with Google </button>
           <p id="auth-error" style="color:#050403;font-size:13px;margin-top:10px;text-align:center;margin-bottom:0;"></p>
        </form>
        </div>
       
    </div>
   </div>
     <script src="script.js"></script>
     <script type="module" src="auth.js"></script>

</body>
</html>
