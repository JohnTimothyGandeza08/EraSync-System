<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERASync Dashboard</title>
    <!-- Uses your own style.css so the background/theme matches the login page -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <h1>ERASync</h1>
        <p id="welcome" style="margin-bottom:20px;">Loading...</p>
        <button id="logout" class="google-btn" style="width:auto;padding:10px 30px;">Log out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        // Use the SAME config as in auth.js
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };

        const ALLOWED_DOMAIN = "neu.edu.ph";
        const auth = getAuth(initializeApp(firebaseConfig));

        // Page guard: only signed-in @neu.edu.ph users may stay here
        onAuthStateChanged(auth, async (user) => {
            const email = (user && user.email || "").toLowerCase();
            if (!user || !user.emailVerified || !email.endsWith("@" + ALLOWED_DOMAIN)) {
                if (user) await signOut(auth);
                window.location.href = "login.html";
                return;
            }
            document.getElementById("welcome").textContent = "Welcome, " + (user.displayName || email) + "!";
        });

        document.getElementById("logout").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
